<!DOCTYPE html>
<html>

<head>

    <title>Edit Property</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>


<body class="bg-light">


<div class="container py-5">

    <h2 class="mb-4">
        Edit Property
    </h2>


    <form method="POST">


        <label class="form-label">
            Title
        </label>

        <input
            type="text"
            class="form-control mb-3"
            name="title"
            value="{{ property.title }}"
            required
        >



        <label class="form-label">
            Property Type
        </label>

        <input
            type="text"
            class="form-control mb-3"
            name="property_type"
            value="{{ property.property_type }}"
            required
        >



        <label class="form-label">
            Price
        </label>

        <input
            type="number"
            class="form-control mb-3"
            name="price"
            value="{{ property.price }}"
            required
        >



        <label class="form-label">
            Area
        </label>

        <input
            type="number"
            step="0.01"
            class="form-control mb-3"
            name="area"
            value="{{ property.area }}"
            required
        >



        <label class="form-label">
            Area Unit
        </label>

        <input
            type="text"
            class="form-control mb-3"
            name="area_unit"
            value="{{ property.area_unit }}"
            required
        >



        <label class="form-label">
            City
        </label>

        <input
            type="text"
            class="form-control mb-3"
            name="city"
            value="{{ property.city }}"
            required
        >



        <label class="form-label">
            Township
        </label>

        <input
            type="text"
            class="form-control mb-3"
            name="township"
            value="{{ property.township }}"
            required
        >



        <label class="form-label">
            Address
        </label>

        <input
            type="text"
            class="form-control mb-3"
            name="address"
            value="{{ property.address }}"
        >



        <label class="form-label">
            Description
        </label>

        <textarea
            class="form-control mb-3"
            name="description"
            rows="5"
        >{{ property.description }}</textarea>



        <label class="form-label">
            Contact Person
        </label>

        <input
            type="text"
            class="form-control mb-3"
            name="contact_person"
            value="{{ property.contact_person }}"
        >



        <label class="form-label">
            Latitude
        </label>

        <input
            type="number"
            step="any"
            class="form-control mb-3"
            name="latitude"
            value="{{ property.latitude }}"
        >



        <label class="form-label">
            Longitude
        </label>

        <input
            type="number"
            step="any"
            class="form-control mb-3"
            name="longitude"
            value="{{ property.longitude }}"
        >



        <label class="form-label">
            Status
        </label>


        <select
            class="form-control mb-4"
            name="status"
        >

            <option value="Draft"
            {% if property.status == "Draft" %}selected{% endif %}>
                Draft
            </option>


            <option value="Published"
            {% if property.status == "Published" %}selected{% endif %}>
                Published
            </option>


        </select>



        <button class="btn btn-success">
            Save Changes
        </button>


        <a href="{{ url_for('main.dashboard') }}"
           class="btn btn-secondary">
            Cancel
        </a>


    </form>


</div>


</body>

</html>
