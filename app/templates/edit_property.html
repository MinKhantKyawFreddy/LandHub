<!DOCTYPE html>
<html>

<head>

    <title>Edit Property</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>


<body class="bg-light">


<div class="container py-5">


    <div class="card shadow mx-auto p-4"
         style="max-width: 850px;">


        <h2 class="mb-4 text-center">
            Edit Property
        </h2>



        <form method="POST">


            <div class="mb-3">

                <label class="form-label">
                    Title
                </label>

                <input
                    type="text"
                    class="form-control"
                    name="title"
                    value="{{ property.title }}"
                    required
                >

            </div>



            <div class="mb-3">

                <label class="form-label">
                    Property Type
                </label>

                <input
                    type="text"
                    class="form-control"
                    name="property_type"
                    value="{{ property.property_type }}"
                    required
                >

            </div>



            <div class="mb-3">

                <label class="form-label">
                    Price
                </label>

                <input
                    type="number"
                    class="form-control"
                    name="price"
                    value="{{ property.price }}"
                    required
                >

            </div>



            <div class="row">


                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Area
                    </label>

                    <input
                        type="number"
                        step="0.01"
                        class="form-control"
                        name="area"
                        value="{{ property.area }}"
                        required
                    >

                </div>



                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Area Unit
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="area_unit"
                        value="{{ property.area_unit }}"
                        required
                    >

                </div>


            </div>



            <div class="row">


                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        City
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="city"
                        value="{{ property.city }}"
                        required
                    >

                </div>



                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Township
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="township"
                        value="{{ property.township }}"
                        required
                    >

                </div>


            </div>




            <div class="mb-3">

                <label class="form-label">
                    Address
                </label>

                <input
                    type="text"
                    class="form-control"
                    name="address"
                    value="{{ property.address }}"
                >

            </div>




            <div class="mb-3">

                <label class="form-label">
                    Description
                </label>

                <textarea
                    class="form-control"
                    name="description"
                    rows="5"
                >{{ property.description }}</textarea>

            </div>




            <div class="mb-3">

                <label class="form-label">
                    Contact Person
                </label>

                <input
                    type="text"
                    class="form-control"
                    name="contact_person"
                    value="{{ property.contact_person }}"
                >

            </div>




            <div class="row">


                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Latitude
                    </label>

                    <input
                        type="number"
                        step="any"
                        class="form-control"
                        name="latitude"
                        value="{{ property.latitude }}"
                    >

                </div>



                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Longitude
                    </label>

                    <input
                        type="number"
                        step="any"
                        class="form-control"
                        name="longitude"
                        value="{{ property.longitude }}"
                    >

                </div>


            </div>




            <div class="mb-4">

                <label class="form-label">
                    Status
                </label>


                <select
                    class="form-select"
                    name="status"
                >

                    <option value="Draft"
                    {% if property.status == "Draft" %}selected{% endif %}>
                        Draft
                    </option>


                    <option value="Published"
                    {% if property.status == "Published" %}selected{% endif %}>
                        Published
                    </option>


                </select>


            </div>




            <div class="d-flex justify-content-between">


                <a href="{{ url_for('main.dashboard') }}"
                   class="btn btn-secondary">

                    Cancel

                </a>



                <button
                    class="btn btn-success">

                    Save Changes

                </button>


            </div>



        </form>


    </div>


</div>


</body>

</html>
